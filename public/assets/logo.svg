<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B4B" />
      <stop offset="25%" stop-color="#F2DDA4" />
      <stop offset="50%" stop-color="#D7AA55" />
      <stop offset="75%" stop-color="#F8E7BE" />
      <stop offset="100%" stop-color="#9C6E28" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#140b10" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Double Gold Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldSheen)" stroke-width="7" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldSheen)" stroke-width="14" />
  <circle cx="250" cy="250" r="211" fill="none" stroke="url(#goldSheen)" stroke-width="3" />

  <!-- Monogram Circle CS -->
  <g transform="translate(250, 160)">
    <!-- Outer CS Ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#goldSheen)" stroke-width="5" />
    <!-- C Shape -->
    <path d="M 28 -28 C 12 -42 -22 -42 -36 -24 C -50 -6 -48 24 -32 40 C -18 52 14 52 30 36 L 20 25 C 8 36 -14 36 -24 24 C -34 12 -34 -10 -22 -22 C -12 -32 10 -32 20 -20 Z" fill="url(#goldSheen)" />
    <!-- Inner S Shape -->
    <path d="M 12 -12 C 12 -18 4 -22 -3 -22 C -11 -22 -17 -17 -17 -11 C -17 -2 -6 2 4 6 C 14 10 21 16 21 26 C 21 38 10 44 -2 44 C -15 44 -23 37 -25 28 L -14 26 C -13 32 -7 35 0 35 C 7 35 12 31 12 25 C 12 18 3 14 -6 10 C -16 6 -24 0 -24 -11 C -24 -23 -13 -31 0 -31 C 12 -31 22 -24 23 -13 Z" fill="url(#goldSheen)" />
  </g>

  <!-- Brand Typography: CASA -->
  <text x="250" y="318" text-anchor="middle" font-family="'Fraunces', 'Cinzel', 'Playfair Display', Georgia, serif" font-weight="900" font-size="82" letter-spacing="4" fill="url(#goldSheen)" filter="url(#softGlow)">CASA</text>

  <!-- Brand Typography: SUNTUOSA -->
  <text x="250" y="366" text-anchor="middle" font-family="'Fraunces', 'Cinzel', 'Playfair Display', Georgia, serif" font-weight="800" font-size="39" letter-spacing="9" fill="url(#goldSheen)">SUNTUOSA</text>
</svg>
